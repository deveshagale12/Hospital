<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0066cc',
                        brandHover: '#0052a3',
                        bgLight: '#f9f9f6'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-bgLight min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm max-w-md w-full p-8 md:p-10 transition-all duration-300">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center text-brandBlue mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 11h10M7 15h10" />
                </svg>
            </div>
            <h1 id="form-title" class="text-2xl font-semibold text-gray-900 tracking-tight">Welcome back</h1>
            <p id="form-subtitle" class="text-sm text-gray-500 mt-1">Sign in to your health dashboard</p>
        </div>

        <div id="alert-box" class="hidden mb-5 p-3 rounded-lg text-sm font-medium border"></div>

        <form id="auth-form" class="space-y-5">
            
            <div id="field-patient-nbr" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Patient Number</label>
                <input type="number" id="patientNbr" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm" placeholder="e.g. 8222157">
            </div>

            <div id="field-fullname" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm" placeholder="John Doe">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1.5">Email address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-[15px]" placeholder="allison.hill655@gmail.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1.5">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-[15px]" placeholder="••••••••••••">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
                <div id="forgot-password-link" class="text-right mt-2">
                    <a href="#" class="text-sm font-medium text-brandBlue hover:underline">Forgot password?</a>
                </div>
            </div>

            <div id="row-demographics-1" class="hidden grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                    <input type="date" id="dob" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                    <select id="gender" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm">
                        <value="">Select</value>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div id="row-demographics-2" class="hidden grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age Group</label>
                    <input type="text" id="age" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm" placeholder="e.g. [20-30)">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Weight Group</label>
                    <input type="text" id="weight" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm" placeholder="e.g. [60-70)">
                </div>
            </div>

            <div id="row-demographics-3" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Race</label>
                    <input type="text" id="race" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm" placeholder="e.g. Asian / Caucasian">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                    <input type="text" id="address" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-brandBlue/20 focus:border-brandBlue transition-all text-sm" placeholder="Enter residential city / details">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full mt-2 bg-white hover:bg-gray-50 border border-gray-300 text-gray-900 font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 shadow-sm focus:outline-none">
                <span id="btn-text">Sign in</span>
                <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-gray-600">
            <span id="toggle-message">No account?</span>
            <button type="button" id="toggle-view-btn" onclick="toggleFormState()" class="text-brandBlue font-medium hover:underline ml-1 focus:outline-none">
                Register here
            </button>
        </div>

    </div>

    <script>
        // Adjust this variable endpoint URL to your backend target configuration hosting context
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8080/api/patients'
            : 'https://hospital-ncnw.onrender.com/api';

        let isLoginState = true;

        // Toggle View Form State (Login <-> Register)
        function toggleFormState() {
            isLoginState = !isLoginState;
            
            // Elements to modify visibility arrays
            const registerFields = [
                document.getElementById('field-patient-nbr'),
                document.getElementById('field-fullname'),
                document.getElementById('row-demographics-1'),
                document.getElementById('row-demographics-2'),
                document.getElementById('row-demographics-3')
            ];
            
            const forgotPasswordLink = document.getElementById('forgot-password-link');
            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const toggleMessage = document.getElementById('toggle-message');
            const toggleViewBtn = document.getElementById('toggle-view-btn');
            const alertBox = document.getElementById('alert-box');

            alertBox.className = "hidden mb-5 p-3 rounded-lg text-sm font-medium border";

            if (isLoginState) {
                // UI View Update -> Show Login configuration UI properties
                registerFields.forEach(el => el.classList.add('hidden'));
                forgotPasswordLink.classList.remove('hidden');
                formTitle.textContent = "Welcome back";
                formSubtitle.textContent = "Sign in to your health dashboard";
                btnText.textContent = "Sign in";
                btnIcon.classList.remove('hidden');
                toggleMessage.textContent = "No account?";
                toggleViewBtn.textContent = "Register here";
                
                // Clear validation attribute rules requirements
                setRegistrationRequirements(false);
            } else {
                // UI View Update -> Show Registration configuration UI fields
                registerFields.forEach(el => el.classList.remove('hidden'));
                forgotPasswordLink.classList.add('hidden');
                formTitle.textContent = "Create Profile";
                formSubtitle.textContent = "Register an official clinic chart record";
                btnText.textContent = "Create Account";
                btnIcon.classList.add('hidden'); // matches design flow parameters
                toggleMessage.textContent = "Already registered?";
                toggleViewBtn.textContent = "Sign in here";
                
                // Set structural requirements fields active
                setRegistrationRequirements(true);
            }
        }

        function setRegistrationRequirements(isRequired) {
            document.getElementById('patientNbr').required = isRequired;
            document.getElementById('fullName').required = isRequired;
        }

        // Toggle Password Vector Visibility Layout
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        // Form Event Handler Execution
        document.getElementById('auth-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const alertBox = document.getElementById('alert-box');
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value;

            // Show intermediate processing layout status update
            alertBox.className = "mb-5 p-3 rounded-lg text-sm font-medium border bg-blue-50 text-blue-700 border-blue-200 text-center";
            alertBox.textContent = isLoginState ? "Authenticating user details..." : "Registering medical profile details...";
            alertBox.classList.remove('hidden');

            if (isLoginState) {
                // ── EXECUTE LOGIN TARGET PIPELINE ──
                const loginPayload = {
                    email: emailInput,
                    password: passwordInput
                };

                try {
                    const response = await fetch(`${API_BASE_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(loginPayload)
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        alertBox.className = "mb-5 p-3 rounded-lg text-sm font-medium border bg-green-50 text-green-700 border-green-200 text-center";
                        alertBox.textContent = "Authentication Success! Redirecting access logs...";
                        
                        // Cache crucial tracking details into sessionStorage
                        sessionStorage.setItem('patient_id', data.id);
                        sessionStorage.setItem('patient_name', data.fullName);
                        
                        // Redirect logic execution mapping format requested
                        setTimeout(() => {
                            window.location.href = 'patientdash.html';
                        }, 1000);
                    } else {
                        // Display targeted service handling execution string
                        throw new Error(data.message || "Invalid authentication parameter mapping credentials provided.");
                    }
                } catch (error) {
                    alertBox.className = "mb-5 p-3 rounded-lg text-sm font-medium border bg-red-50 text-red-700 border-red-200 text-center";
                    alertBox.textContent = error.message;
                }

            } else {
                // ── EXECUTE REGISTRATION PIPELINE ──
                const registrationPayload = {
                    patientNbr: parseInt(document.getElementById('patientNbr').value),
                    fullName: document.getElementById('fullName').value.trim(),
                    email: emailInput,
                    password: passwordInput,
                    address: document.getElementById('address').value.trim() || null,
                    dob: document.getElementById('dob').value || null,
                    race: document.getElementById('race').value.trim() || null,
                    gender: document.getElementById('gender').value || null,
                    age: document.getElementById('age').value.trim() || null,
                    weight: document.getElementById('weight').value.trim() || null
                };

                try {
                    const response = await fetch(`${API_BASE_URL}/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(registrationPayload)
                    });

                    if (response.status === 201 || response.ok) {
                        alertBox.className = "mb-5 p-3 rounded-lg text-sm font-medium border bg-green-50 text-green-700 border-green-200 text-center";
                        alertBox.textContent = "Registration Success! Switching to login interface...";
                        
                        // Reset target field layout inputs smoothly
                        document.getElementById('auth-form').reset();
                        
                        setTimeout(() => {
                            toggleFormState();
                            document.getElementById('email').value = registrationPayload.email;
                        }, 1500);
                    } else {
                        // Attempt to extract explicit message configuration logs from exceptions array
                        const errText = await response.text();
                        throw new Error(errText || "Database structural creation failed. Verify format inputs matching constraint parameters.");
                    }
                } catch (error) {
                    alertBox.className = "mb-5 p-3 rounded-lg text-sm font-medium border bg-red-50 text-red-700 border-red-200 text-center";
                    alertBox.textContent = error.message;
                }
            }
        });
    </script>
</body>
</html>
